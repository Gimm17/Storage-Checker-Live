[package]
name = "storage-checker-live"
version = "0.1.0"
description = "Lightweight Windows Disk Bloat Monitor, Risk Analyzer & Session Recap"
edition = "2021"
authors = ["Storage Checker Team"]
default-run = "storage-checker-live"

[lib]
name = "storage_checker_live_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri Core & Plugins
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"

# Serialization & Identity
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4.38", features = ["serde"] }

# Database (M1)
rusqlite = { version = "0.33", features = ["bundled"] }

# Multi-threaded Scanner & Traversal (M2)
jwalk = "0.8"
rayon = "1.10"

# Safe Cleanup & System Integration (M3)
trash = "5.2"
sysinfo = "0.33"
open = "5.3"
dirs = "6.0"
thiserror = "2.0"

# Win32 Native APIs (GetCompressedFileSizeW, GetDiskFreeSpaceW, Restart Manager, EmptyWorkingSet, Shell)
[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_RestartManager",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Shell",
]

[profile.dev]
incremental = true

[profile.release]
opt-level = "z"        # Optimize for size
lto = true             # Enable link-time optimization
codegen-units = 1      # Maximize size reduction
panic = "unwind"        # Remove unwinding landing pads
strip = true           # Automatically strip symbols from the binary
